{% extends "base.html" %}

{% block content %}

<div class="auth-container">
    <div class="auth-card">

        <h2>Create Account</h2>
        <p>Join your team and preserve important project knowledge.</p>

        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <small class="error">{{ error }}</small>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit" class="auth-button">
                Create Account
            </button>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>
</div>

{% endblock %}
